[project]
name = "rhino-architect"
version = "4.10.0"
description = "AI Bridge MCP server for Rhino 8 (protocol 5: multiplexed, idempotent retries, cancel, binary frames; RHINO_TOOLS lean/standard/full tool profiles)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
    "orjson>=3.10",
    "pymupdf>=1.24.0",      # PDF tools: get_pdf_info, preview_pdf_page, trace_pdf
    "numpy>=1.26",           # numerical geometry helpers and PDF/image analysis
    "opencv-python-headless>=4.9",  # image processing without GUI dependencies
    "openai>=1.0",          # used by chat.py - works for OpenAI, Ollama, and any OAI-compatible endpoint
]

[project.scripts]
rhino-architect = "rhino_architect.server:main"
rhino-chat      = "chat:main"          # uv run rhino-chat  (or: uv run python chat.py)
rhino-architect-doctor = "rhino_architect.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhino_architect"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real-bug rules only (syntax errors + pyflakes); style stays the author's call.
select = ["E9", "F"]
