name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin:
    name: Rhino plugin build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build plugin
        run: dotnet build plugin/RhinoAIBridge.csproj -c Release

      # dist/plugin is what INSTALL.bat actually copies onto a user's machine.
      # It once drifted six weeks behind the source, so every install shipped a
      # plugin missing most of the server's commands.
      #
      # NOTE: we cannot compare hashes against a fresh build - .NET embeds a new
      # MVID in every compile, so two builds of identical source never match.
      # The script checks assembly version + full command coverage instead.
      - name: dist/plugin must not be stale
        shell: pwsh
        run: pwsh scripts/check_dist_current.ps1

  python:
    name: Python MCP checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv --directory server sync --group dev --frozen
      - name: Syntax check
        run: >
          uv --directory server run --frozen python -m py_compile
          src/rhino_architect/server.py
          src/rhino_architect/protocol.py
          src/rhino_architect/pdf_tracer.py
          src/rhino_architect/material_downloader.py
          src/rhino_architect/doctor.py
          src/rhino_architect/validation.py
          chat.py
      - name: Lint (ruff - real-bug rules only)
        run: uv --directory server run --frozen ruff check src tests ../evals
      - name: Tests
        run: uv --directory server run --frozen python -m pytest -q
